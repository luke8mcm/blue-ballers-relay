name: ESPN relay

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: espn-relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ESPN data
        run: python fetch_espn.py
      - name: Commit if changed
        run: |
          git config user.name "espn-relay-bot"
          git config user.email "espn-relay-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
